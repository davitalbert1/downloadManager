; EXEMPLO DE API DE ARQUIVOS COM JOBS ASSINCRONOS
; Todos os endpoints, payload e autenticacao ficam aqui; o codigo e generico.
; Tokens do corpo: {ano} {mes} {dataset_api} {extensao} {product_type}
;                   {data_format} {download_format} {vars_json} {dias_json}
;                   {horarios_json}
; [dataset:era5]
; tipo_saida = arquivo
; pasta_saida = dados_era5
; extensao = grib
; db = dados/clima.db
; tabela = clima_horario
; auto_importar_banco = 1
; dataset_api = reanalysis-era5-single-levels
; product_type = reanalysis
; horarios = 00:00, 12:00
; data_format = grib
; download_format = unarchived
; ano_inicial = 1940
; dias_atraso = 7
; url = https://cds.climate.copernicus.eu/api
;
; ; Autenticacao: chave da variavel de ambiente, enviada no header PRIVATE-TOKEN
; api_key_env = CDSAPI_KEY
; api_key_em = header
; api_key_header = PRIVATE-TOKEN
; api_key_prefix =
;
; ; Fluxo de jobs: POST cria, consulta status, busca resultado
; job_executar = /retrieve/v1/processes/{dataset_api}/execute
; job_status = /retrieve/v1/jobs/{job_id}
; job_resultado = /retrieve/v1/jobs/{job_id}/results
; job_listar_ativos = /retrieve/v1/jobs?status=accepted&status=running&limit=100
; job_listar_ok = /retrieve/v1/jobs?status=successful&limit=100
; job_lista_campo = jobs
; job_campo_dataset = processID
; job_campo_id = jobID
; job_campo_status = status
; job_campo_asset = metadata.results
; job_status_ok = successful, completed, succeeded
; job_status_erro = rejected, failed, dismissed, cancelled, canceled, error
; job_reenviar_se = maximum number queued, queued requests, request data sequentially
; job_poll_intervalo = 10
; job_sequencial = 1
; job_cancelar_duplicados = 1
;
; corpo = {"inputs":{"product_type":["{product_type}"],"variable":{vars_json},"year":["{ano}"],"month":["{mes}"],"day":{dias_json},"time":{horarios_json},"data_format":"{data_format}","download_format":"{download_format}"}}
;
; vars = 10m_u_component_of_wind, 10m_v_component_of_wind, 2m_temperature, 2m_dewpoint_temperature, surface_pressure, mean_sea_level_pressure, total_precipitation, surface_solar_radiation_downwards

