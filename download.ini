; DOWNLOAD GENERICO: cada [dataset:<id>] = uma API -> tabela de um banco.
; pasta_saida/pasta_imagens aceitam path ABSOLUTO (ex: F:\dados\out,
; C:/dados/out, /mnt/dados/out, \\servidor\pasta) ou relativo ao CWD.
; Aspas sao opcionais ("F:\minha pasta\out"); ~, %VAR%, $VAR/${VAR}
; sao expandidos. Relativo continua relativo; absoluto nunca e
; prefixado com o diretorio atual.
; db = dados/arquivo .db (vazio = db_path do [geral])
; tabela = tabela destino (padrao = id)
; url = URL base da API (varias: "url_a | url_b" -> rotacao round-robin;
; endpoints em cooldown de 429 sao pulados automaticamente)
; url_passado = URL p/ datas < hoje (ex: archive); url_futuro p/ datas >= hoje
; api_keys = "k1 | k2" -> rotaciona &apikey= por request; CADA CHAVE TEM
; ORCAMENTO PROPRIO (multiplica a cota). Tambem existe no [geral].
; bloco = bloco JSON com os dados (daily, hourly, ...)
; params_chave = nome do parametro de query (daily=... / hourly=...)
; vars = variaveis pedidas a API (vira "bloco=v1,v2")
; COLUNAS nao se declaram: o codigo le a resposta JSON, descobre as
; colunas, cria/evolui a tabela sozinha (PRAGMA + CREATE/ADD COLUMN)
; e infere os tipos (real|integer|text) dos dados. Opcional:
; coluna.<col> = <var_api>[:tipo] renomeia/tipa uma coluna descoberta.
; data_min/data_max = filtro (data YYYY-MM-DD ou "hoje")
; granularidade = dia | hora | salvar_hora = 1 adiciona coluna "hora"
; Varias APIs no MESMO banco: basta repetir db (tabelas iguais fazem
; MERGE por chave via UPSERT; tabelas diferentes coexistem).
; API em banco DIFERENTE: basta outro db (ex: [dataset:metais] db=ar.db).

[geral]
db_path = clima.db
max_sql_dates_por_lote = 900
; Threads HTTP genéricas. process_workers grava no SQLite.
download_workers = 6
process_workers = 2
chunk_dias = 30
; tamanho_max_bytes = limite GLOBAL de tamanho p/ arquivos baixados
; (arquivo/drive/wikipedia + imagens vinculadas). Maiores sao PULADOS
; automaticamente (log [SKIP], nao contam como falha). Aceita bytes ou
; sufixos KB/MB/GB/TB (ex: 500MB, 1.5GB, 104857600). 0/vazio = sem limite.
; Pode ser sobrescrito por dataset (ex: tamanho_max_bytes = 50MB).
; tamanho_max_bytes = 1000MB
requests_per_second = 2.0
max_retries = 8
http_timeout = 120
jitter_inicial_max = 5.0
backoff_inicial = 2.0
backoff_maximo = 60.0
min_rps = 0.5
cooldown_429 = 30.0
circuit_limit_429 = 3
espera_min_429 = 5.0
limite_minuto = 600
limite_hora = 5000
limite_dia = 10000
custo_vars_ref = 10
custo_dias_ref = 14
custo_dias_fator = 1.5
cooldown_quota = 900
fuso_horario = America/Sao_Paulo
periodo_inicio = 1940-01-01
periodo_fim = 2025-12-31

