; DATASETS: cada secao [dataset:<id>] declara API, banco e tabela; as
; colunas sao descobertas da resposta JSON e tipadas automaticamente.
; Opcional: "coluna.X = var_api:tipo" renomeia/tipa uma coluna.
[dataset:clima_diario]
db = dados/clima.db
tabela = clima_diario
url = https://api.open-meteo.com/v1/forecast
url_passado = https://archive-api.open-meteo.com/v1/archive
bloco = daily
params_chave = daily
granularidade = dia
salvar_timezone = 1
vars_excluir = relativehumidity_2m_max, relativehumidity_2m_min, moonrise, moonset
vars = weathercode, temperature_2m_max, temperature_2m_min, apparent_temperature_max, apparent_temperature_min, relativehumidity_2m_max, relativehumidity_2m_min, precipitation_sum, precipitation_probability_max, rain_sum, showers_sum, snowfall_sum, sunrise, sunset, uv_index_max, uv_index_clear_sky_max, windspeed_10m_max, winddirection_10m_dominant, windgusts_10m_max, pressure_msl_max, pressure_msl_min, surface_pressure_max, surface_pressure_min
[dataset:clima_horario]
db = dados/clima.db
tabela = clima_horario
url = https://api.open-meteo.com/v1/forecast
url_passado = https://archive-api.open-meteo.com/v1/archive
bloco = hourly
params_chave = hourly
granularidade = hora
salvar_hora = 1
vars = temperature_2m, apparent_temperature, relativehumidity_2m, dewpoint_2m, precipitation, precipitation_probability, rain, showers, snowfall, snow_depth, uv_index, uv_index_clear_sky, windspeed_10m, winddirection_10m, windgusts_10m, pressure_msl, surface_pressure, cloudcover, cloudcover_low, cloudcover_mid, cloudcover_high, visibility, is_day, weathercode

[dataset:qualidade_ar]
db = dados/clima.db
tabela = qualidade_ar
url = https://air-quality-api.open-meteo.com/v1/air-quality
bloco = hourly
params_chave = hourly
granularidade = hora
salvar_hora = 1
data_min = 2013-01-01
vars = pm10, pm2_5, carbon_monoxide, nitrogen_dioxide, sulphur_dioxide, ozone, dust, formaldehyde

[dataset:polen]
db = dados/clima.db
tabela = polen
url = https://air-quality-api.open-meteo.com/v1/air-quality
bloco = hourly
params_chave = hourly
granularidade = hora
salvar_hora = 1
data_min = hoje
vars = alder_pollen, birch_pollen, olive_pollen, ragweed_pollen, grass_pollen

